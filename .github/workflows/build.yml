name: Build plug-ins

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publish a GitHub Release with this version tag (e.g. v1.0.0). Leave empty to just build."
        required: false
        default: ""

jobs:
  build:
    name: ${{ matrix.artifact }} - ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_APP_SIGN_ID: ${{ secrets.MACOS_APP_SIGN_ID }}
      MACOS_INSTALLER_SIGN_ID: ${{ secrets.MACOS_INSTALLER_SIGN_ID }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
      TARGET: ${{ matrix.target }}
      PRODUCT: ${{ matrix.product }}
      AU_CODE: ${{ matrix.au }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: Combined, target: MacDanialHillsStack, product: "MacDanial Hills Mastering Compressor", au: "aufx Mdhc Bsmt", artifact: MacDanialHills-AB, os: macos-latest,   name: macOS }
          - { dir: Combined, target: MacDanialHillsStack, product: "MacDanial Hills Mastering Compressor", au: "aufx Mdhc Bsmt", artifact: MacDanialHills-AB, os: windows-latest, name: Windows }
          - { dir: A,        target: BasementalOD2,       product: "MacDanial Hills A",                    au: "aufx Mdha Bsmt", artifact: A-MacDanialHills,  os: macos-latest,   name: macOS }
          - { dir: A,        target: BasementalOD2,       product: "MacDanial Hills A",                    au: "aufx Mdha Bsmt", artifact: A-MacDanialHills,  os: windows-latest, name: Windows }
          - { dir: B,        target: MacDanialHills,      product: "MacDanial Hills B",                    au: "aufx Mdhb Bsmt", artifact: B-MacDanialHills,  os: macos-latest,   name: macOS }
          - { dir: B,        target: MacDanialHills,      product: "MacDanial Hills B",                    au: "aufx Mdhb Bsmt", artifact: B-MacDanialHills,  os: windows-latest, name: Windows }
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: ${{ matrix.dir }}/build/_deps/juce-src
          key: juce-8.0.4-${{ runner.os }}-${{ matrix.dir }}

      - name: Configure (macOS, universal binary)
        if: runner.os == 'macOS'
        run: cmake -B build -G Xcode

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        # Release build with debug symbols (PDB) so crash reports show source locations.
        run: cmake -B build -A x64 "-DCMAKE_CXX_FLAGS_RELEASE=/O2 /Ob2 /DNDEBUG /Zi" "-DCMAKE_MODULE_LINKER_FLAGS_RELEASE=/DEBUG /OPT:REF /OPT:ICF" "-DCMAKE_SHARED_LINKER_FLAGS_RELEASE=/DEBUG /OPT:REF /OPT:ICF"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Import Developer ID certificates (macOS, only if secrets are set)
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        run: |
          set -e
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')

      - name: Sign locally, validate AU, package (macOS)
        if: runner.os == 'macOS'
        run: |
          set -e
          ART="build/${TARGET}_artefacts/Release"
          mkdir -p ../dist
          for b in "$ART/AU/${PRODUCT}.component" "$ART/VST3/${PRODUCT}.vst3" "$ART/Standalone/${PRODUCT}.app" "$ART/AAX/${PRODUCT}.aaxplugin"; do
            [ -e "$b" ] || continue
            if [ -n "${MACOS_APP_SIGN_ID:-}" ]; then
              codesign --force --deep --timestamp --options runtime -s "$MACOS_APP_SIGN_ID" "$b"
            else
              codesign --force --deep -s - "$b"     # ad-hoc (no Apple Developer ID yet)
            fi
            ditto -c -k --keepParent "$b" "../dist/$(basename "$b")-macOS.zip"
          done
          rm -rf ~/Library/Audio/Plug-Ins/Components/"${PRODUCT}.component"
          cp -R "$ART/AU/${PRODUCT}.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v $AU_CODE

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../dist | Out-Null
          $art = "build/${env:TARGET}_artefacts/Release"
          foreach ($p in @("$art/VST3/${env:PRODUCT}.vst3", "$art/AAX/${env:PRODUCT}.aaxplugin", "$art/Standalone/${env:PRODUCT}.exe")) {
            if (Test-Path $p) { Compress-Archive -Path $p -DestinationPath "../dist/$(Split-Path $p -Leaf)-Windows.zip" -Force }
          }

      - name: pluginval host-compatibility test (macOS)
        if: runner.os == 'macOS' && matrix.dir == 'Combined'
        run: |
          set -e
          curl -sSL -o "$RUNNER_TEMP/pluginval.zip" https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -oq "$RUNNER_TEMP/pluginval.zip" -d "$RUNNER_TEMP/pv"
          "$RUNNER_TEMP/pv/pluginval.app/Contents/MacOS/pluginval" --strictness-level 7 --validate-in-process \
              --timeout-ms 600000 --validate "build/${TARGET}_artefacts/Release/VST3/${PRODUCT}.vst3"

      - name: pluginval host-compatibility test (Windows)
        if: runner.os == 'Windows' && matrix.dir == 'Combined'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile "$env:RUNNER_TEMP\pluginval.zip"
          Expand-Archive "$env:RUNNER_TEMP\pluginval.zip" -DestinationPath "$env:RUNNER_TEMP\pv" -Force
          $vst3 = "build/${env:TARGET}_artefacts/Release/VST3/${env:PRODUCT}.vst3"
          $pv   = "$env:RUNNER_TEMP\pv\pluginval.exe"
          # Windows Error Reporting: write a full crash dump if pluginval crashes
          $dumps = "$env:RUNNER_TEMP\dumps"
          New-Item -ItemType Directory -Force $dumps | Out-Null
          $key = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\pluginval.exe"
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -Value $dumps -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -Value 2 -PropertyType DWord -Force | Out-Null

          # pluginval is a windowed (GUI-subsystem) app: PowerShell's "&" would not wait for it.
          $pvArgs = @("--strictness-level", "7", "--validate-in-process", "--timeout-ms", "600000", "--validate", "`"$((Resolve-Path $vst3).Path)`"")
          $proc = Start-Process -FilePath $pv -ArgumentList $pvArgs -NoNewWindow -Wait -PassThru
          $code = $proc.ExitCode
          if ($code -ne 0) {
            Write-Host "pluginval exit code: $code"
            Start-Sleep -Seconds 10
            $dump = Get-ChildItem $dumps -Filter *.dmp -ErrorAction SilentlyContinue | Select-Object -First 1
            $cdb  = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($dump -and $cdb) {
              $pdbDirs = (Get-ChildItem build -Recurse -Filter *.pdb | ForEach-Object { $_.DirectoryName } | Sort-Object -Unique) -join ';'
              & $cdb.FullName -z $dump.FullName -lines -y "$pdbDirs" -c ".symopt+0x40;.echo ===CRASH===;.ecxr;kp 40;.echo ===ALLTHREADS===;~*kp 25;q"
            } else { Write-Host "No crash dump was written (dump=$($dump -ne $null), cdb=$($cdb -ne $null))" }
            exit 1
          }

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ matrix.name }}
          path: dist/*


  package-macos:
    name: One macOS installer (everything)
    needs: build
    runs-on: macos-latest
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_INSTALLER_SIGN_ID: ${{ secrets.MACOS_INSTALLER_SIGN_ID }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-macOS"
          path: artifacts
      - name: Import Developer ID certificates (only if secrets are set)
        if: env.MACOS_CERT_P12 != ''
        run: |
          set -e
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
      - name: Build the all-in-one installer
        run: |
          set -e
          mkdir -p stage out
          for z in artifacts/*/*.zip; do ditto -x -k "$z" stage/; done
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q markdown
          "$RUNNER_TEMP/venv/bin/python" tools/manual_to_html.py MANUAL.md "stage/MacDanial Hills Manual.html"
          ls -1 stage
          VERSION="$(sed -n 's/^project([^ ]* VERSION \([0-9.]*\)).*/\1/p' Combined/CMakeLists.txt)"
          PKG="out/MacDanial Hills Mastering Compressor ${VERSION} macOS Installer.pkg"
          INSTALLER_SIGN_ID="${MACOS_INSTALLER_SIGN_ID:-}" installer/macos/build_complete_pkg.sh stage "$VERSION" "$PKG"
          if [ -n "${NOTARY_APPLE_ID:-}" ] && [ -n "${MACOS_INSTALLER_SIGN_ID:-}" ]; then
            xcrun notarytool submit "$PKG" --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --wait
            xcrun stapler staple "$PKG"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: MacDanialHills-Complete-Installer-macOS
          path: out/*.pkg

  package-windows:
    name: One Windows installer (everything)
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-Windows"
          path: artifacts
      - name: Build the all-in-one installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage, out | Out-Null
          Get-ChildItem artifacts -Recurse -Filter *.zip | ForEach-Object { Expand-Archive $_.FullName -DestinationPath stage -Force }
          python -m pip install -q markdown
          python tools/manual_to_html.py MANUAL.md "stage/MacDanial Hills Manual.html"
          Get-ChildItem stage | ForEach-Object { $_.Name }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          $version = (Select-String -Path Combined/CMakeLists.txt -Pattern 'project\(\S+ VERSION ([0-9.]+)\)').Matches[0].Groups[1].Value
          $stage = (Resolve-Path stage).Path
          $isccArgs = @("/DAppVersion=$version", "/DStage=$stage", "/DOutputDir=$((Resolve-Path out).Path)")
          $main = "MacDanial Hills Mastering Compressor"
          if (Test-Path "stage/$main.aaxplugin")              { $isccArgs += "/DHasAAX" }
          if (Test-Path "stage/$main.exe")                    { $isccArgs += "/DHasApp" }
          if (Test-Path "stage/MacDanial Hills Manual.html")  { $isccArgs += "/DHasManual" }
          if (Test-Path "stage/MacDanial Hills A.vst3")       { $isccArgs += "/DHasA" }
          if (Test-Path "stage/MacDanial Hills B.vst3")       { $isccArgs += "/DHasB" }
          & $iscc @isccArgs installer/windows/complete.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: MacDanialHills-Complete-Installer-Windows
          path: out/*.exe

  release:
    name: Publish release (on v* tags)
    needs: [ package-macos, package-windows ]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "MacDanialHills-Complete-Installer-*"
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_version || github.ref_name }}
          name: MacDanial Hills Mastering Compressor ${{ inputs.release_version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          body: |
            MacDanial Hills Mastering Compressor ${{ inputs.release_version || github.ref_name }} by Basemental.
            Install with the macOS .pkg or the Windows .exe. See MANUAL.md for the full guide.
          files: |
            dist/**/*
            MANUAL.md
